# Base compose file. The image runs the HTTP server (the Dockerfile's final
# `http` stage), so layer the overlay, which publishes the port:
#   docker compose -f docker-compose.yml -f docker-compose.http.yml up
services:
  telegram:
    image: n24q02m/telegram:latest
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_DATA_DIR=/data
    volumes:
      - telegram-data:/data
volumes:
  telegram-data:
