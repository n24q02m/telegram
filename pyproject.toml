[project]
name = "n24q02m-telegram"
version = "4.25.1-beta.1"
description = "Production-grade MCP server for Telegram — dual-mode Bot API + MTProto, domain-separated tools"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = "==3.13.*"
authors = [{ name = "n24q02m", email = "quangminh2422004@gmail.com" }]
keywords = [
    "mcp", "mcp-server", "model-context-protocol",
    "telegram", "telegram-bot", "telegram-api",
    "claude", "cursor", "copilot", "antigravity", "codex", "opencode",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]
dependencies = [
    # Standalone FastMCP: hull's HTTP transport mounts `FastMCP.http_app()`.
    # Range matches hull's own pin.
    "fastmcp>=4.1.6,<5",
    "n24q02m-hull>=0.8.0,<0.9",
    "httpx>=0.28.1",
    "telethon>=1.45.0",
    "pydantic>=2.14.3,<2.15",
    # 2.15 warns while constructing MCP SDK Settings; lift after upstream rebuilds its model.
    "pydantic-settings>=2.14.2,<2.15",
    "loguru>=0.7.3",
    "cryptography>=50.0.2",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
    "cryptg>=0.6.1",
]
[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
    "ty>=0.0.100",
    "pre-commit>=4.7.0",
]
[project.scripts]
telegram = "telegram.cli:main"
better-telegram-mcp = "telegram.cli:main"  # legacy command alias
# `uvx <dist>` runs the executable named after the distribution, so MCP Registry
# clients (server.json identifier), the plugin manifest and Smithery need it.
n24q02m-telegram = "telegram.cli:main"
[project.urls]
Homepage = "https://github.com/n24q02m/telegram"
Repository = "https://github.com/n24q02m/telegram"
Issues = "https://github.com/n24q02m/telegram/issues"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Resolve only releases at least 7 days old, the same hold Renovate's
# minimumReleaseAge puts on third-party packages. Without it Renovate's
# artifact step (`uv lock`) and lock file maintenance (`uv lock --upgrade`)
# pick up releases younger than the hold, and Renovate rejects the branch.
# n24q02m-hull is released by this stack and consumed right after release,
# so it is exempt here and in renovate.json alike.
exclude-newer = "7 days"
exclude-newer-package = { n24q02m-hull = false }

[tool.hatch.build.targets.wheel]
packages = ["src/telegram"]
[tool.hatch.build.targets.wheel.sources]
"src" = ""
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# hooks/tests holds the plugin-hook suite, which sits beside the script it
# loads (hooks/check-credentials.py) instead of under tests/. Listing it here
# is what makes a plain `pytest` run it at all.
testpaths = ["tests", "hooks/tests"]
pythonpath = ["tests"]
timeout = 30
markers = [
    "integration: integration tests (require Telegram credentials)",
    "live: live MCP protocol tests (spawns server subprocess)",
    "full: full/real bot mode tests via MCP protocol (requires bot token + chat)",
    "e2e: end-to-end tests via MCP protocol (requires credentials + setup mode)",
]
addopts = "-m 'not integration and not live and not full and not e2e'"
[tool.ruff]
# Files repo-bootstrap copies in are replaced on every apply and follow the
# toolkit's own style. Linting or formatting them here (CI or the pre-commit
# hooks, which pass --force-exclude) would leave a copy apply reports as drifted.
extend-exclude = ["scripts/repo-bootstrap", "scripts/main_integrity.py", "scripts/merge_gate.py"]
target-version = "py313"
line-length = 88
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]
[tool.ruff.format]
quote-style = "double"
[tool.ty.environment]
python-version = "3.13"
[tool.ty.rules]
import-not-found = "ignore"
possibly-unresolved-reference = "ignore"
missing-attribute = "ignore"
invalid-explicit-return = "ignore"
invalid-argument-type = "ignore"
not-iterable = "ignore"
invalid-assignment = "ignore"
incompatible-method-override = "ignore"
invalid-implicit-return-in-function-with-stub-body = "ignore"
[tool.coverage.run]
source = ["telegram"]
omit = [
    "tests/*",
]
[tool.coverage.report]
fail_under = 95
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [".claude-plugin/plugin.json:version", "server.json:version"]
tag_format = "v{version}"
commit_message = "chore(release): v{version}"
major_on_zero = false
# version_toml only stamps pyproject.toml, but uv.lock also records this
# project's own version. Without a relock the release commit and its tag keep
# the previous version in uv.lock, so `uv sync --locked` on the tag fails.
# PSR runs this as one `sh -c`; `set -e` makes a failed lock stop the release.
build_command = """
set -e
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
"""
[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
[tool.semantic_release.remote]
type = "github"
