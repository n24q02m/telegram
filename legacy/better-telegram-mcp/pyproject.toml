[project]
name = "better-telegram-mcp"
version = "4.22.1"
description = "Renamed to n24q02m-telegram. Transitional stub that installs n24q02m-telegram."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "n24q02m", email = "quangminh2422004@gmail.com" }]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
requires-python = "==3.13.*"
dependencies = ["n24q02m-telegram>=4.22.0"]

[project.urls]
Homepage = "https://github.com/n24q02m/telegram"
Source = "https://github.com/n24q02m/telegram"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# No importable package. `uvx better-telegram-mcp` only resolves executables owned by the
# requested distribution, so the stub re-declares the legacy command and points
# it at the entry point shipped by n24q02m-telegram (identical wrapper to the alias there).
[project.scripts]
better-telegram-mcp = "telegram.cli:main"

[tool.hatch.build.targets.wheel]
bypass-selection = true
